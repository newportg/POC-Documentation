name: Publish documentation to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'POC-Documentation-Vault/README.md'
      - 'POC-Documentation-Vault/projects/**'
      - 'POC-Documentation-Vault/wiki/**'
      - 'POC-Documentation-Vault/scripts/publish_pages.py'
      - 'POC-Documentation-Vault/requirements-pages.txt'
      - 'mkdocs.yml'
      - 'POC-Documentation-Vault/stylesheets/**'
      - 'mkdocs_hooks.py'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install publishing dependency
        run: python -m pip install -r POC-Documentation-Vault/requirements-pages.txt

      - name: Render PlantUML ArchiMate diagrams
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/plantuml.jar" \
            https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar
          for file in POC-Documentation-Vault/projects/*/architecture.puml; do
            java -jar "$RUNNER_TEMP/plantuml.jar" -tsvg -failfast2 "$file"
          done

      - name: Build site
        run: mkdocs build --config-file mkdocs.yml --strict

      - name: Publish PlantUML architecture sources
        shell: bash
        run: |
          for file in POC-Documentation-Vault/projects/*/*.puml; do
            target="_site/${file#POC-Documentation-Vault/}"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
          done
          for file in POC-Documentation-Vault/projects/*/*.svg; do
            target="_site/${file#POC-Documentation-Vault/}"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
